name: CI

on:
  push:
    branches: [main, perf/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:types

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Monorepo Lint
        run: npm run lint

      - name: Server Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nectar_test"
          GEMINI_API_KEY: "test-mock-gemini-key"
          ACCESS_TOKEN_SECRET: "mock-super-secure-access-token-secret-32chars"
          REFRESH_TOKEN_SECRET: "mock-super-secure-refresh-token-secret-32chars"
          NODE_ENV: "test"
          GEMINI_MODE: "stub"
          RATE_LIMIT_DISABLED: "true"

      - name: Monorepo Build
        run: npm run build
